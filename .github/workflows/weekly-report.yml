name: Weekly SEO Report

on:
  schedule:
    - cron: '17 13 * * 5'   # Every Friday at 13:17 UTC
  workflow_dispatch:         # Allow manual runs from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          PAGESPEED_API_KEY:        ${{ secrets.PAGESPEED_API_KEY }}
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:         ${{ secrets.SLACK_CHANNEL_ID }}
        run: python run_weekly_seo_pipeline.py

      # Retain the generated PDF even if the Slack post fails
      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-seo-report
          path: posthog_ai_report.pdf
          retention-days: 30
